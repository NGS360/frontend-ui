services:
  client:
    container_name: frontend-ui
    build:
      context: .
      dockerfile: Dockerfile
    networks:
      - ngs360-network
    ports:
      - '8085:8080'
    volumes:
      - ./:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:3000/
      # Set to false to hide the AI Assistant; read when the dev server boots,
      # so a change needs a container restart.
      - VITE_AI_CHAT_ENABLED=${VITE_AI_CHAT_ENABLED:-true}

networks:
  ngs360-network:
    external: true
