name: Build Frontend UI

on:
  push:
    branches:
      - main
      - develop
  # No branches: filter. With one, a pull request targeting anything other than
  # main or develop gets no CI at all -- which is how a 30-file diff carrying a
  # generator major-version bump and a Node image change (#89, based on a feature
  # branch) reached main having been checked by nothing.
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Ahead of the build: a failing unit test should be reported as a failing
      # test, not as whatever the build happens to do next.
      - name: Run tests
        run: npm test

      - name: Build application
        run: npm run build
        env:
          VITE_API_URL: https://ngs360.org
          # Flip to 'false' to ship a build without the AI Assistant.
          VITE_AI_CHAT_ENABLED: 'true'

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: matrix.node-version == '22.x'
        with:
          name: frontend-build
          path: dist/
          retention-days: 7